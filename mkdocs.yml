site_name: Santiago Tobón
site_url: https://santiagotobon.co/
site_description: "Economist at Universidad EAFIT. Research on organized crime, policing, prisons, and illicit markets."
site_author: Santiago Tobón

# Custom minimal theme in theme/ (main.html + css/site.css), Nov 2026. Replaces MkDocs Material.
theme:
  name: null
  custom_dir: theme
  static_templates:
    - 404.html
  locale: en

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: false

plugins:
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: es
          name: Español
          build: true
          nav:
            - Inicio: index.md
            - Investigación: research/publications.md
            - Libro: book.md
            - Escritos: writing/index.md
            - Valor Público: centro.md
            - Sobre mí: about.md

nav:
  - Home: index.md
  - Research: research/publications.md
  - Book: book.md
  - Writing: writing/index.md
  - Valor Público: centro.md
  - About: about.md

copyright: Santiago Tobón · Universidad EAFIT · Medellín, Colombia
